[tools]
lg = "1.11.1"
lgx = "0.1.0-rc2"
cljfmt = "0.16.4"
clj-kondo = "2026.05.25"
lefthook = "2.1.6"
tailwindcss = "4.3.1"

[tool_alias]
lg = "github:nooga/let-go"
lgx = "github:abogoyavlensky/lgx"
cljfmt = "asdf:https://github.com/b-social/asdf-cljfmt"
tailwindcss = "asdf:https://github.com/virtualstaticvoid/asdf-tailwindcss"

[settings]
# let-go 1.11.0+ ships GitHub artifact attestations whose TSA timestamp fails
# Sigstore verification. Skip just that check; checksum and SLSA provenance still verify. 
# Remove once nooga/let-go re-releases with a verifiable TSA.
github_attestations = false
