name: pages

on:
  push:
    branches: [master]
    paths:
      - 'landing/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, don't cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v3
        with:
          install_args: tailwindcss

      - name: Build CSS
        working-directory: landing
        run: tailwindcss -i ./input.css -o ./style.css --minify

      - name: Assemble site
        run: |
          mkdir -p _site
          cp landing/index.html landing/style.css landing/og.png landing/CNAME _site/
          cp landing/favicon.ico landing/favicon.svg landing/apple-touch-icon.png _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
