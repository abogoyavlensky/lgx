name: test

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LG_VERSION: 1.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Install let-go (lg)
        run: |
          base="https://github.com/nooga/let-go/releases/download/v${LG_VERSION}"
          tarball="let-go_${LG_VERSION}_linux_amd64.tar.gz"
          curl -sSL -o "$tarball" "$base/$tarball"
          curl -sSL -o checksums.txt "$base/checksums.txt"
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball"
          sudo mv lg /usr/local/bin/lg
          lg -v

      - name: Run tests
        run: make test
